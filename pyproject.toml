[project]
name = "ha-mentat"
version = "0.1.0"
description = "Home Assistant integration for System One decision models (Jev, Clef)"
license = "MIT"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PIE", "RET", "SIM", "PTH", "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=custom_components.mentat --cov-report=term-missing"
