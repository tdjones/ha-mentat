# HACS offers GitHub releases, not tags, so a tag mirrored from GitLab becomes a
# release here. The tag must match manifest.json, or HACS would show one version
# and Home Assistant another.
name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against the manifest
        run: |
          manifest=$(jq -r .version custom_components/mentat/manifest.json)
          if [ "$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $manifest"
            exit 1
          fi

      - name: Take the notes from CHANGELOG.md
        run: |
          awk -v v="$GITHUB_REF_NAME" '
            index($0, "## " v " ") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no entry for $GITHUB_REF_NAME"
            exit 1
          fi

      # gh ships on the runner, so the one step holding a write token runs no
      # third-party code.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
